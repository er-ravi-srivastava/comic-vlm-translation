# Model Configurations & Access Parameters

models:
  # Tier 1: Top Open VLM Benchmark
  qwen_vl:
    name: "Qwen/Qwen2.5-VL-7B-Instruct"
    provider: "huggingface"
    device_map: "auto"
    torch_dtype: "bfloat16"
    temperature: 0.0
    max_new_tokens: 512

  # Tier 2: Alternative Open VLM
  llama_vision:
    name: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    provider: "huggingface"
    device_map: "auto"
    torch_dtype: "bfloat16"
    temperature: 0.0
    max_new_tokens: 512

  # Tier 3: Proprietary Upper Bound
  gpt4o:
    name: "gpt-4o"
    provider: "openai"
    temperature: 0.0
    max_tokens: 512

  gemini_pro:
    name: "gemini-1.5-pro"
    provider: "google"
    temperature: 0.0
    max_tokens: 512

  # Text-Only MT Baselines
  nllb_mt:
    name: "facebook/nllb-200-3.3B"
    provider: "huggingface"
    device_map: "auto"
    max_length: 512

  llama_text:
    name: "meta-llama/Llama-3.1-8B-Instruct"
    provider: "huggingface"
    device_map: "auto"
    temperature: 0.0
    max_new_tokens: 512

  # Cascaded OCR
  ocr:
    engine: "manga-ocr" # Options: "manga-ocr", "paddleocr"
